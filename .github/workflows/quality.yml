name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.0"
          - "8.2"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          coverage: none

      - name: Lint PHP files
        run: >-
          find dreamax-license-manager.php uninstall.php src scripts tests
          -type f -name '*.php' -print0 |
          xargs -0 -n1 php -l

  quality:
    name: Tests and static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          extensions: dom, filter, json, libxml, mbstring, simplexml, sodium, tokenizer, xmlreader, xmlwriter
          tools: composer
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked dependencies
        run: composer audit --locked

      - name: Run PHPUnit
        run: composer test

      - name: Run PHPStan
        run: composer analyse

      - name: Run WordPress Coding Standards
        run: composer phpcs

      - name: Validate release metadata
        run: composer release:validate
